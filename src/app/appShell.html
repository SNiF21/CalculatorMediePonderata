<!-- Top Disclaimer Banner -->
<div class="bg-slate-950 border-b border-slate-800 text-slate-300 text-[11px] sm:text-xs py-1.5 px-4 text-center flex items-center justify-center gap-1.5 font-medium tracking-wide">
  <span class="text-amber-400 text-xs">⚠️</span>
  <span>Aplicație WEB neoficială, neafiliată ULBS</span>
</div>

<header class="bg-slate-900 border-b border-slate-800 text-white sticky top-0 z-50 shadow-md">
  <div class="container mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
    
    <!-- Logo / Brand -->
    <div class="flex items-center space-x-3">
      <span class="text-2xl select-none">📐</span>
      <a routerLink="/" class="text-lg md:text-xl font-bold tracking-tight text-white hover:text-blue-400 transition">
        Calculator Medie Ponderată
      </a>
    </div>

    <!-- Navigation & Auth Controls -->
    <div class="flex flex-wrap items-center gap-2 sm:gap-4 text-sm">
      
      <!-- Nav Links with Active Highlighting -->
      <nav class="flex items-center space-x-1 sm:space-x-2">
        <a
          routerLink="/"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="bg-blue-600 text-white font-semibold shadow-sm"
          class="text-slate-300 hover:text-white hover:bg-slate-800/80 transition px-3.5 py-1.5 rounded-xl text-xs sm:text-sm"
        >
          {{ authService.isLoggedIn() ? 'Profil' : 'Acasă' }}
        </a>

        <a
          routerLink="/calculator"
          routerLinkActive="bg-blue-600 text-white font-semibold shadow-sm"
          class="text-slate-300 hover:text-white hover:bg-slate-800/80 transition px-3.5 py-1.5 rounded-xl text-xs sm:text-sm"
        >
          Calculator
        </a>
      </nav>

      <!-- Authenticated Student State -->
      <ng-container *ngIf="authService.isLoggedIn(); else guestState">
        <div class="flex items-center space-x-2 sm:space-x-3 pl-2 sm:pl-3 border-l border-slate-700">
          <a
            routerLink="/"
            class="flex items-center space-x-2 bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/70 rounded-full py-1 px-3 transition cursor-pointer"
            title="Mergi la pagina de profil"
          >
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-xs text-slate-200 font-medium max-w-[130px] sm:max-w-[200px] truncate">
              {{ authService.studentEmail() }}
            </span>
          </a>
          <button
            type="button"
            (click)="logout()"
            class="text-xs bg-slate-800 hover:bg-rose-900/40 text-slate-300 hover:text-rose-200 border border-slate-700 hover:border-rose-700/50 py-1.5 px-3 rounded-lg transition cursor-pointer"
          >
            Deconectare
          </button>
        </div>
      </ng-container>

      <!-- Guest State -->
      <ng-template #guestState>
        <a
          routerLink="/login"
          routerLinkActive="bg-blue-700 shadow-inner"
          class="bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs sm:text-sm px-4 py-1.5 rounded-lg shadow-sm transition flex items-center space-x-1.5 cursor-pointer"
        >
          <span>Conectare</span>
          <span class="text-[10px] text-blue-200">(@ulbsibiu.ro)</span>
        </a>
      </ng-template>

    </div>
  </div>
</header>

<main class="container mx-auto p-4 sm:p-6 min-h-[calc(100vh-140px)]">
  <router-outlet></router-outlet>
</main>

<footer class="border-t border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/50 text-center text-xs text-slate-500 dark:text-slate-400 py-5 px-4">
  <div class="container mx-auto flex flex-col sm:flex-row items-center justify-center gap-2">
    <span>© {{ currentYear }} <strong>Colac Andrei-Catalin</strong>. Toate drepturile rezervate.</span>
    <span class="hidden sm:inline text-slate-300 dark:text-slate-700">•</span>
