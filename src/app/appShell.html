<header class="bg-slate-900 border-b border-slate-800 text-white sticky top-0 z-50 shadow-md">
  <div class="container mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
    
    <!-- Logo / Brand -->
    <div class="flex items-center space-x-3">
      <span class="text-2xl select-none">📐</span>
      <a routerLink="/" class="text-lg md:text-xl font-bold tracking-tight text-white hover:text-blue-400 transition">
        Calculator Medie Ponderată <span class="hidden sm:inline text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-900/60 text-blue-300 ml-1.5 border border-blue-700/50">ULBS</span>
      </a>
    </div>

    <!-- Center / Right Controls -->
    <div class="flex flex-wrap items-center gap-3 md:gap-5 text-sm">
      
      <!-- Global Semester Switcher -->
      <div class="flex items-center bg-slate-800 p-1 rounded-xl border border-slate-700/80 text-xs font-semibold" title="Comutator semestru la nivelul întregii aplicații">
        <button
          type="button"
          *ngFor="let s of studyContext.semesters"
          (click)="setSemester(s.roman)"
          [class.bg-blue-600]="studyContext.semester() === s.roman"
          [class.text-white]="studyContext.semester() === s.roman"
          [class.shadow-sm]="studyContext.semester() === s.roman"
          [class.text-slate-400]="studyContext.semester() !== s.roman"
          [class.hover:text-slate-200]="studyContext.semester() !== s.roman"
          class="px-2.5 py-1 rounded-lg transition-all cursor-pointer"
        >
          <span class="hidden sm:inline">{{ s.roman }}</span>
          <span class="sm:hidden">{{ s.shortLabel }}</span>
        </button>
      </div>

      <nav class="flex items-center space-x-3 md:space-x-4">
        <a routerLink="/" class="text-slate-300 hover:text-white transition px-2 py-1 rounded">Acasă</a>
        <a routerLink="/calculator" class="text-slate-300 hover:text-white transition px-2 py-1 rounded">Calculator</a>
      </nav>

      <!-- Authenticated Student State -->
      <ng-container *ngIf="authService.isLoggedIn(); else guestState">
        <div class="flex items-center space-x-3 pl-3 border-l border-slate-700">
          <div class="flex items-center space-x-2 bg-slate-800/80 border border-slate-700/70 rounded-full py-1 px-3">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-xs text-slate-200 font-medium max-w-[140px] sm:max-w-[200px] truncate" [title]="authService.studentEmail()">
              {{ authService.studentEmail() }}
            </span>
          </div>
          <button
            type="button"
            (click)="logout()"
            class="text-xs bg-slate-800 hover:bg-rose-900/40 text-slate-300 hover:text-rose-200 border border-slate-700 hover:border-rose-700/50 py-1.5 px-3 rounded-lg transition cursor-pointer"
          >
            Deconectare
          </button>
        </div>
      </ng-container>

      <!-- Guest State -->
      <ng-template #guestState>
        <a
          routerLink="/login"
          class="bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs sm:text-sm px-4 py-1.5 rounded-lg shadow-sm transition flex items-center space-x-1.5"
        >
          <span>Conectare</span>
          <span class="text-[10px] text-blue-200">(@ulbsibiu.ro)</span>
        </a>
      </ng-template>

    </div>
  </div>
</header>

<main class="container mx-auto p-4 sm:p-6 min-h-[calc(100vh-140px)]">
  <router-outlet></router-outlet>
</main>

<footer class="border-t border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/50 text-center text-xs text-slate-500 p-4">
  <p>© Facultatea de Inginerie — ULBS Sibiu • Calculator Medie Ponderată</p>
</footer>
