<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm animate-fadeIn">
  <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl p-6 sm:p-8 shadow-2xl border border-rose-200 dark:border-rose-900/60 space-y-4">
    
    <div class="flex items-center space-x-3 text-rose-600 pb-2">
      <span class="text-3xl select-none">⚠️</span>
      <div>
        <h3 class="font-extrabold text-lg text-slate-900 dark:text-white">
          Ești sigur că vrei să ștergi contul?
        </h3>
        <p class="text-xs text-rose-600 font-semibold">Această acțiune este ireversibilă!</p>
      </div>
    </div>

    <div class="p-3.5 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200/80 dark:border-rose-900/60 text-xs text-slate-700 dark:text-rose-200 leading-relaxed">
      Toate datele tale asociate adresei <strong class="text-slate-900 dark:text-white">{{ authService.studentEmail() }}</strong>, inclusiv profilul de student și notele examenelor salvate în Firestore, vor fi <strong>șterse definitiv</strong>.
    </div>

    <!-- Error Alert -->
    <div *ngIf="deleteError()" class="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 text-xs text-rose-700 dark:text-rose-300">
      {{ deleteError() }}
    </div>

    <form (ngSubmit)="submitDeleteAccount()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
          Pentru confirmare, introdu parola contului:
        </label>
        <input
          type="password"
          [ngModel]="deletePassword()"
          (ngModelChange)="deletePassword.set($event)"
          name="deletePassword"
          required
          placeholder="Parola ta actuală"
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm outline-none focus:ring-2 focus:ring-rose-500/20 focus:border-rose-500 transition"
        />
      </div>

      <div class="flex items-center justify-end gap-2 pt-3">
        <button
          type="button"
          (click)="close()"
          class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer"
        >
          Renunță
        </button>
        <button
          type="submit"
          [disabled]="isDeletingAccount()"
          class="px-5 py-2.5 text-xs font-semibold rounded-xl bg-rose-600 hover:bg-rose-700 text-white shadow-md shadow-rose-500/20 transition disabled:opacity-50 cursor-pointer flex items-center gap-1.5"
        >
          <span *ngIf="isDeletingAccount()" class="animate-spin text-sm">⏳</span>
          <span>Șterge definitiv contul</span>
        </button>
      </div>
    </form>
  </div>
</div>
