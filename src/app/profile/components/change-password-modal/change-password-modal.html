<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm animate-fadeIn">
  <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl p-6 sm:p-8 shadow-2xl border border-slate-200 dark:border-slate-800 space-y-4">
    
    <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
      <h3 class="font-bold text-lg text-slate-800 dark:text-white flex items-center gap-2">
        <span>🔑</span> Schimbare Parolă
      </h3>
      <button
        type="button"
        (click)="close()"
        class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xl font-bold cursor-pointer"
      >
        ✕
      </button>
    </div>

    <!-- Error Alert -->
    <div *ngIf="passwordError()" class="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900 text-xs text-rose-700 dark:text-rose-300">
      {{ passwordError() }}
    </div>

    <!-- Success Alert -->
    <div *ngIf="passwordSuccess()" class="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-900 text-xs text-emerald-700 dark:text-emerald-300">
      {{ passwordSuccess() }}
    </div>

    <form (ngSubmit)="submitPasswordChange()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
          Parola actuală
        </label>
        <input
          type="password"
          [ngModel]="currentPassword()"
          (ngModelChange)="currentPassword.set($event)"
          name="currentPassword"
          required
          placeholder="Introdu parola actuală"
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
          Noua parolă
        </label>
        <input
          type="password"
          [ngModel]="newPassword()"
          (ngModelChange)="newPassword.set($event)"
          name="newPassword"
          required
          minlength="6"
          placeholder="Minimum 6 caractere"
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
          Confirmă noua parolă
        </label>
        <input
          type="password"
          [ngModel]="confirmNewPassword()"
          (ngModelChange)="confirmNewPassword.set($event)"
          name="confirmNewPassword"
          required
          placeholder="Reintrodu noua parolă"
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition"
        />
      </div>

      <div class="flex items-center justify-end gap-2 pt-3">
        <button
          type="button"
          (click)="close()"
          class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer"
        >
          Anulează
        </button>
        <button
          type="submit"
          [disabled]="isChangingPassword()"
          class="px-5 py-2.5 text-xs font-semibold rounded-xl bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition disabled:opacity-50 cursor-pointer flex items-center gap-1.5"
        >
          <span *ngIf="isChangingPassword()" class="animate-spin text-sm">⏳</span>
          <span>Salvează noua parolă</span>
        </button>
      </div>
    </form>
  </div>
</div>
